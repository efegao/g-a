    // LİSTEYİ EKRANA BASAN FONKSİYON
    function renderMenu() {
      const container = document.getElementById('drinks-container');
      container.innerHTML = '';

      Object.keys(drinkDetails).forEach(drinkName => {
        const item = drinkDetails[drinkName];
        
        const card = document.createElement('div');
        card.className = "bg-gray-800 p-4 rounded-lg shadow-md hover:bg-gray-750 transition cursor-pointer flex justify-between items-center border border-gray-700";
        card.onclick = () => openModal(drinkName, item.fiyat, item.icerik);

        card.innerHTML = `
          <div>
            <h2 class="font-semibold text-lg text-gray-100">${drinkName}</h2>
            <p class="text-xs text-gray-400 mt-1 line-clamp-1">${item.icerik}</p>
          </div>
          <span class="text-yellow-400 font-bold text-md whitespace-nowrap ml-4">${item.fiyat}</span>
        `;
        
        container.appendChild(card);
      });
    }

    // MODAL AÇ / KAPAT
    function openModal(title, price, desc) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-price').innerText = price;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    // SAYFA YÜKLENDİĞİNDE ÇALIŞTIR
    window.onload = renderMenu;
