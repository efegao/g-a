<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Garson Asistanı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10 select-none">

  <!-- Arama ve Filtreler -->
  <div class="sticky top-0 bg-slate-900/95 backdrop-blur border-b border-slate-800 p-4 z-40">
    <input type="text" id="searchInput" onkeyup="searchItems()" placeholder="Yemek, içecek veya mod ara..." 
      class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-amber-500 text-lg">
    
    <div class="flex gap-2 mt-3 overflow-x-auto pb-1 no-scrollbar">
      <button onclick="filterType('all')" class="px-4 py-2 bg-slate-800 rounded-lg text-sm font-semibold whitespace-nowrap active:bg-amber-600">Hepsini Göster</button>
      <button onclick="filterType('mod')" class="px-4 py-2 bg-amber-600 rounded-lg text-sm font-semibold whitespace-nowrap">😎 Müşteri Modları</button>
      <button onclick="filterType('yemek')" class="px-4 py-2 bg-emerald-700 rounded-lg text-sm font-semibold whitespace-nowrap">🍽️ Yemekler</button>
      <button onclick="filterType('icecek')" class="px-4 py-2 bg-purple-700 rounded-lg text-sm font-semibold whitespace-nowrap">🍹 İçecekler</button>
    </div>
  </div>

  <!-- Liste -->
  <div id="contentList" class="p-4 space-y-3"></div>

  <!-- DETAY MODAL -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeModal(event)">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="closeModalDirect()" class="absolute top-4 right-4 text-slate-400 text-2xl font-bold p-1">✕</button>
      
      <h2 id="modalTitle" class="text-xl font-bold text-amber-400 mb-1 pr-8"></h2>
      <div id="modalPrice" class="text-emerald-400 font-extrabold text-2xl mb-4"></div>

      <div class="space-y-3 text-sm">
        <div id="modalContentBox" class="bg-slate-900/70 p-3 rounded-xl border border-slate-700/50 hidden">
          <span class="text-slate-400 font-semibold block text-xs uppercase mb-1">İçerik & Bilgi</span>
          <p id="modalContent" class="text-slate-200"></p>
        </div>

        <div id="modalNoteBox" class="bg-amber-950/40 border border-amber-800/40 p-3 rounded-xl hidden">
          <span class="text-amber-400 font-semibold block text-xs uppercase mb-1">💡 Garson Taktiği</span>
          <p id="modalNote" class="text-amber-200/90 italic"></p>
        </div>
      </div>

      <button onclick="closeModalDirect()" class="w-full mt-5 py-3 bg-amber-600 active:bg-amber-700 rounded-xl font-bold text-white text-center">Kapat</button>
    </div>
  </div>

  <script>
    // İÇECEK DETAY VERİTABANI
    const drinkDetails = {
      "Efes fıçı": { fiyat: "250 TL (33cl) / 259 TL (50cl)", icerik: "Klasik fıçı bira, taze ve yüksek içimli.", note: "En hızlı servis edilen bira." },
      "Efes Malt": { fiyat: "250 TL", icerik: "%100 malt arpadan üretilmiş yumuşak içimli bira.", note: "Yemeklerin yanında nötrleyici olarak çok iyi gider." },
      "Hoegaarden": { fiyat: "310 TL", icerik: "Belçika buğday birası. Kişniş ve portakal kabuğu aromalı, bulanık ve ferahlatıcı.", note: "Limon dilimiyle servis edilir, deniz ürünlerine çok yakışır." },
      "Belfast Irish Lager": { fiyat: "310 TL (50cl)", icerik: "Koyu renkli, karamelize malt tatları içeren ferah lager.", note: "Tavuk ve burger yanına çok satar." },
      "Erdinger": { fiyat: "320 TL", icerik: "Geleneksel Alman buğday birası. Maya aromalı ve yüksek gövdeli.", note: "Peynirli pizzalarla mükemmel uyum sağlar." },
      "Duvel": { fiyat: "520 TL (33cl)", icerik: "%8.5 alkollü yüksek kaliteli Belçika ale birası. Sert ve meyvemsi.", note: "Ağır ve sert bira isteyen müşteriye öner." },
      "Amsterdam": { fiyat: "480 TL (50cl)", icerik: "%8.4 alkol oranına sahip sert ve yoğun malt aromalı lager.", note: "Alkol oranı yüksek arayanlara direkt önerilir." },
      "Gin Tonic": { fiyat: "560 TL", icerik: "Cin, tonik, taze salatalık veya limon dilimi.", note: "En ucuz ve en risksiz kokteyl." },
      "Tom Collins": { fiyat: "595 TL", icerik: "Cin, taze limon suyu, şeker şurubu ve soda.", note: "Ferahlatıcı, tatlı-ekşi dengeli." },
      "Mojito": { fiyat: "625 TL", icerik: "Beyaz rom, taze nane, esmer şeker, misket limonu ve soda.", note: "Serinletici klasik tercihlerden biri." },
      "Lynchburg Lemonade": { fiyat: "660 TL", icerik: "Tennessee viskisi, triple sec, tatlı-ekşi sos ve gazoz.", note: "Alkolü hissettirmez ama hızlı çarpar." },
      "Long Island": { fiyat: "690 TL", icerik: "Cin, votka, rom, tekila, triple sec, tatlı-ekşi sos ve kola.", note: "Menünün en yüksek alkollü kokteyli." },
      "Negroni": { fiyat: "675 TL", icerik: "Eşit oranda Cin, Campari ve Kırmızı Tatlı Vermut.", note: "Acımsı (bitter), sofistike ve sert bir klasik." },
      "Whiskey Sour": { fiyat: "640 TL", icerik: "Viski, taze limon suyu, şeker şurubu ve yumurta akı köpüğü.", note: "Klasik ve karizmatik tercih." },
      "Kuğulu": { fiyat: "605 TL", icerik: "Meyveli tatlı kokteyl bazı, görsel sunumlu.", note: "Görselliği yüksek, hafif içkili." },
      "Hot Passion": { fiyat: "650 TL", icerik: "Tropikal meyve aromaları, tekila/votka bazı ve acı sos.", note: "Acıseven ve farklı deneyim arayan müşteriye." },
      "Daydream": { fiyat: "695 TL", icerik: "Koyu renkli meyve özleri ve premium alkol karışımı.", note: "Romantik masaların en çok satan kokteyli." },
      "Obsession": { fiyat: "645 TL", icerik: "Tekila, taze fesleğen, karabiber dokunuşu ve narenciye.", note: "Farklı arayıştakilere bu cümleyle sat: 'Bunu çok az kişi bilir.'" },
      "Kuzuyu Cin Çarptı": { fiyat: "625 TL", icerik: "Cin, salatalık, nane ve ferahlatıcı botanik özler.", note: "En serinletici ve ferahlatıcı kokteyl." },
      "Cheesecake Martini": { fiyat: "620 TL", icerik: "Kremamsı likörler, vanilya özü ve bisküvit kırıntılı kadeh kenarı.", note: "Yemek sonrası tatlı niyetine satılabilir." },
      "Red Spanish Sangria": { fiyat: "580 TL", icerik: "Kırmızı şarap, taze meyve taneleri, likör dokunuşu ve tarçın.", note: "Kalabalık gruplara ve masaya neşe katmak için birebir." },
      "Prosecco": { fiyat: "650 TL (Kadeh) / 2900 TL (Şişe)", icerik: "İtalyan köpüklü beyaz şarabı. Meyvemsi ve canlı kabarcıklı.", note: "Kutlama ve özel an masalarına öner." },
      "Kabatepe Beyaz": { fiyat: "320 TL (Kadeh)", icerik: "Hafif gövdeli, yüksek asitli ve ferahlatıcı yerli beyaz şarap.", note: "Tavuk ve hafif başlangıçların yanına yaz." },
      "Sav Blanc": { fiyat: "380 TL (Kadeh)", icerik: "Sauvignon Blanc. Çim, taze yeşil biber ve tropikal meyve aromalı.", note: "Deniz ürünleri ve kalamarın zorunlu eşi." },
      "Kabatepe Rosé": { fiyat: "320 TL (Kadeh)", icerik: "Kırmızı meyve aromalı, canlı ve dengeli pembe şarap.", note: "Acılı ve baharatlı yemeklerin acısını keser." },
      "Kabatepe Kırmızı": { fiyat: "320 TL (Kadeh)", icerik: "Orta gövdeli, kırmızı meyve bukelerine sahip rahat içimli kırmızı şarap.", note: "Burger ve pizzaların yanına ideal." }
    };

    // YEMEK VE MOD VERİLERİ
    const data = [
      { type: "mod", title: "Yeni geldim, henüz ısınmadım", detail: "Gin Tonic (560₺) / Mojito (625₺)", note: "Sade, tanıdık, risksiz. Konuşmaya başlarken elde bardak olsun." },
      { type: "mod", title: "Arkadaşlarla eğlenceli bir gece", detail: "Red Spanish Sangria (580₺) / Long Island (690₺)", note: "Sangria masaya gelince ortam açılır." },
      { type: "mod", title: "Romantik/özel akşam yemeği", detail: "Daydream (695₺) / Black Angel (695₺)", note: "Koyu, şık, görseli güçlü." },
      { type: "mod", title: "İş yemeği, resmi ama rahat", detail: "Negroni (675₺) / Whiskey Sour (640₺)", note: "Sofistike görünür, abartısız." },
      { type: "mod", title: "Doğum günü/kutlama", detail: "Kuğulu (605₺) + Prosecco öner", note: "Önce Kuğulu rengiyle gelsin, sonra Prosecco." },
      { type: "mod", title: "Bugün çok yoruldum, kafamı dağıtacağım", detail: "Long Island (690₺) / Lynchburg Lemonade (660₺)", note: "Long Island söylemeden git. Lynchburg limonata gibi başlar." },
      
      { type: "yemek", title: "Kaşık Patates / Trüf Patates", bira: ["Efes fıçı", "Hoegaarden"], kokteyl: ["Gin Tonic", "Tom Collins"], sarap: ["Kabatepe Beyaz"], note: "Hafif başlangıç, içeceği de hafif tut." },
      { type: "yemek", title: "Dinamit Tavuk", bira: ["Efes fıçı"], kokteyl: ["Kuğulu", "Hot Passion"], sarap: ["Kabatepe Rosé"], note: "Acılı yemek -> meyveli/tatlı içecek acıyı dengeler." },
      { type: "yemek", title: "Kalamar Tava", bira: ["Hoegaarden", "Erdinger"], kokteyl: ["Tom Collins", "Gin Tonic"], sarap: ["Sav Blanc"], note: "Deniz ürünü = beyaz şarap, kural bu." },
      { type: "yemek", title: "Peynir Tabağı", bira: ["Duvel", "Hoegaarden"], kokteyl: ["Prosecco"], sarap: ["Kabatepe Beyaz", "Sav Blanc"], note: "Peynir + beyaz/köpüklü = klasik kombinasyon." },
      { type: "yemek", title: "Hamburger / Cheeseburger", bira: ["Efes fıçı", "Amsterdam"], kokteyl: ["Lynchburg Lemonade"], sarap: ["Kabatepe Kırmızı"], note: "Burger + bira = evrensel doğru." },
      { type: "yemek", title: "Fettucini Alfredo", bira: [], kokteyl: ["Tom Collins", "Gin Tonic"], sarap: ["Kabatepe Beyaz"], note: "Krema sosu + beyaz şarap = klasik." }
    ];

    let currentFilter = 'all';

    function renderData(items) {
      const list = document.getElementById('contentList');
      list.innerHTML = '';

      items.forEach((item) => {
        if (currentFilter !== 'all' && item.type !== currentFilter) return;

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700/60 shadow-md";

        if (item.type === 'mod') {
          card.innerHTML = `
            <h3 class="font-bold text-amber-400 text-base mb-1">😎 "${item.title}"</h3>
            <div class="text-slate-200 font-medium text-sm mb-2">👉 ${item.detail}</div>
            <div class="text-slate-400 text-xs italic">💡 ${item.note}</div>
          `;
        } else {
          card.innerHTML = `
            <h3 class="font-bold text-emerald-400 text-lg mb-2 border-b border-slate-700/50 pb-1">🍽️ ${item.title}</h3>
            <div class="space-y-2 mb-2">
              ${renderDrinkButtons('Bira', item.bira, 'amber')}
              ${renderDrinkButtons('Kokteyl', item.kokteyl, 'pink')}
              ${renderDrinkButtons('Şarap', item.sarap, 'purple')}
            </div>
            ${item.note ? `<div class="text-slate-400 text-xs italic bg-slate-900/40 p-2 rounded-lg border border-slate-800">💡 ${item.note}</div>` : ''}
          `;
        }
        list.appendChild(card);
      });
    }

    function renderDrinkButtons(label, list, color) {
      if (!list || list.length === 0) return '';
      const colorClasses = {
        amber: 'bg-amber-950/60 text-amber-300 border-amber-800/60 active:bg-amber-800',
        pink: 'bg-pink-950/60 text-pink-300 border-pink-800/60 active:bg-pink-800',
        purple: 'bg-purple-950/60 text-purple-300 border-purple-800/60 active:bg-purple-800'
      };

      const buttons = list.map(drink => `
        <button onclick="openDrinkModal('${drink}')" class="px-2.5 py-1 rounded-lg border text-xs font-semibold mr-1 mb-1 inline-block ${colorClasses[color]}">
          ${drink} 🔍
        </button>
      `).join('');

      return `<div class="text-xs"><span class="text-slate-400 font-semibold block mb-1">${label}:</span>${buttons}</div>`;
    }

    function openDrinkModal(drinkName) {
      const details = drinkDetails[drinkName] || { fiyat: "Fiyat bilgisi yok", icerik: "Klasik servis içeceği.", note: "Müşterinin damak tadına göre önerin." };
      
      document.getElementById('modalTitle').innerText = drinkName;
      document.getElementById('modalPrice').innerText = details.fiyat;
      document.getElementById('modalContent').innerText = details.icerik;
      document.getElementById('modalNote').innerText = details.note;

      document.getElementById('modalContentBox').classList.remove('hidden');
      document.getElementById('modalNoteBox').classList.remove('hidden');
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModalDirect() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function closeModal(e) {
      if (e.target.id === 'detailModal') closeModalDirect();
    }

    function searchItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = data.filter(i => 
        i.title.toLowerCase().includes(query) || 
        (i.bira && i.bira.some(b => b.toLowerCase().includes(query))) ||
        (i.kokteyl && i.kokteyl.some(k => k.toLowerCase().includes(query))) ||
        (i.sarap && i.sarap.some(s => s.toLowerCase().includes(query)))
      );
      renderData(filtered);
    }

    function filterType(type) {
      currentFilter = type;
      searchItems();
    }

    renderData(data);
  </script>
</body>
</html>
